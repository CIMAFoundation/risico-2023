name: build after release

on:
  release:
    types: [published]

jobs:
  build-with-musl:
    name: release x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      # NetCDF and HDF5 are pure Rust; the only C code left is the vendored
      # zstd used by the Zarr writer, which musl-gcc compiles. The result is a
      # fully static binary that runs on any x86_64 Linux regardless of glibc.
      - name: install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release --features build-binary --bin risico-2023 --target x86_64-unknown-linux-musl

      - name: check the binary is static
        run: |
          file target/x86_64-unknown-linux-musl/release/risico-2023
          ! ldd target/x86_64-unknown-linux-musl/release/risico-2023 2>&1 | grep -q '=>'

      - name: Add file to release
        uses: meeDamian/github-release@2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: risico-2023-linux-musl:target/x86_64-unknown-linux-musl/release/risico-2023
          tag: ${{ github.ref_name }}
          allow_override: true
