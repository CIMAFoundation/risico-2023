[package]
name = "risico-2023"
description = "risico-2023 Wildfire Risk Assessment Model by CIMA Research Foundation"
tags = ["wildfire", "risk assessment model"]
license = "EUPL-1.2"
version = "1.1.0-rc1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# build-binary must be enabled in order to build the binaries
build-binary = [
    "config",
    "dep:log",
    "dep:clap",
    "dep:pretty_env_logger",
    "dep:libflate",
    "dep:png",
    "dep:rstar",
    "dep:serde_yaml",
    "dep:clap_derive",
    "dep:netcdf-reader",
    "dep:geotiff-reader",
    "dep:libc",
    "dep:zarrs",
    "dep:serde_json",
    "dep:nc4-stream",
]

# The `configuration.yml` schema (risico::config), usable without the runner.
config = ["dep:serde_yaml", "dep:log"]

gdal_bindgen = ["gdal", "gdal/bindgen"]
gdal = ["dep:gdal"]

default = ["build-binary"]

[dependencies]
clap = { version = "4.5.16", features = ["cargo", "derive"], optional = true }
clap_derive = { version = "4.5.13", optional = true }
log = { version = "0.4.17", optional = true }
strum = { version = "0.26.3", optional = false }
strum_macros = { version = "0.26.4", optional = false }
pretty_env_logger = { version = "0.5.0", optional = true }
itertools = { version = "0.13.0", optional = false }
chrono = { version = "0.4", features = ["serde"], optional = false }
serde = { version = "1.0", optional = false }
bincode = "1.3"
libflate = { version = "2.0.0", optional = true }
rayon = { version = "1.6.0", optional = false }
ndarray = { version = "0.16.0", features = ["rayon"], optional = false }
ndarray-stats = { version = "0.5.1", optional = false }
png = { version = "0.17.7", optional = true }
rstar = { version = "0.12.0", optional = true }
serde_derive = { version = "1.0.209", optional = false }
serde_yaml = { version = "0.9.17", optional = true }
cftime-rs = { git = "https://github.com/CIMAFoundation/cftime-rs-no-cdylib"}
chrono-tz = {version = "0.6"}
# current IANA rules for the local standard noon of the FWI `cffdrs` version
# (0.6 predates e.g. Europe/Kyiv, America/Nuuk -2, Asia/Almaty +5)
chrono-tz-current = { package = "chrono-tz", version = "0.10.4" }
lazy_static = "1.4.0"

# Native dependencies (GDAL only, and only for the static-data converter)
gdal = { version = "0.19.0", default-features = false, optional = true }
# Pure-Rust NetCDF: netcdf-reader reads classic and NetCDF-4 inputs and
# snapshots, nc4-stream writes NetCDF-4 outputs and snapshots.
netcdf-reader = { version = "0.12", optional = true }
geotiff-reader = { version = "=0.7.0", default-features = false, features = ["local"], optional = true }
tzf-rs = { version = "0.4.9", default-features = false }
libc = { version = "0.2", optional = true }
zarrs = { version = "0.22.4", optional = true, default-features = false, features = ["filesystem", "zstd"] }
serde_json = { version = "1.0", optional = true }
nc4-stream = { path = "crates/nc4-stream", optional = true }



[lib]
name = "risico"
path = "src/lib/mod.rs"

[[bin]]
name = "risico-2023"
path = "src/bin/main.rs"
# required-features = ["build-binary"]

[[bin]]
name = "static-converter"
path = "src/bin/static-converter.rs"
required-features = ["build-binary", "gdal"]

[[bin]]
name = "warm-state-converter"
path = "src/bin/warm-state-converter.rs"
required-features = ["build-binary"]

[[bin]]
name = "streaming-inspect"
path = "src/bin/streaming-inspect.rs"
required-features = ["build-binary"]

# [[bin]]
# name = "test-config"
# path = "src/bin/test-config.rs"
# required-features = ["build-binary"]

[workspace]
members = ["crates/nc4-stream"]
