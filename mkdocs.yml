site_name: RISICO
site_description: "RISICO: the wildfire danger forecasting model of CIMA Research Foundation"
site_url: ""
repo_url: https://github.com/CIMAFoundation/risico-2023
repo_name: CIMAFoundation/risico-2023

theme:
  name: material
  logo: img/cima.png
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - content.code.copy
    - toc.follow

extra:
  version:
    provider: mike

nav:
  - Home: index.md
  - User Guide:
      - Getting Started: getting-started.md
      - How RISICO Works: concepts.md
      - Input Data: input-data.md
      - Configuration: configuration.md
      - Fire Danger Indices: indices.md
      - CLI Usage: cli.md
      - Large Domains and Performance: execution.md
      - Converting Legacy Data: conversion.md
      - References: references.md
  - Developer Guide:
      - Programmatic Workflow: programmatic.md
      - API Reference: api-reference.md
      - Building the Web Demo: web-demo.md
  - Interactive Demo: demo.md

markdown_extensions:
  - admonition
  - def_list
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - stylesheets/cima-theme.css

extra_javascript:
  - javascripts/cima-brand.js
